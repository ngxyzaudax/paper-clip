[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-clip"
version = "1.1.0"
description = "Serialize data to physical paper using color-coded dot grids"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer",
    "rich",
    "textual",
    "Pillow",
    "numpy",
    "reedsolo",
    "zstandard",
    "opencv-python-headless",
    "qrcode>=8.2",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.6",
    "tensorflow>=2.21.0; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

[project.optional-dependencies]
hardware = [
    "pycups; sys_platform == 'darwin' or sys_platform == 'linux'",
    "python-sane; sys_platform == 'linux'",
]

[project.scripts]
paper-clip = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: heavier sweeps and neural-net checks",
]
