[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-clip"
version = "0.1.0"
description = "Serialize data to physical paper using color-coded dot grids"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer",
    "rich",
    "textual",
    "Pillow",
    "numpy",
    "reedsolo",
    "zstandard",
    "opencv-python-headless",
    "tomli-w",
    "qrcode>=8.2",
    "pyzbar>=0.1.9",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.6",
    "pycups",
    "python-sane",
    "apriltag-python>=3.4.5",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
ml = ["tensorflow>=2.16"]

[project.scripts]
paper-clip = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
