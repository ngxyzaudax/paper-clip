[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-clip"
version = "0.1.0"
description = "Serialize data to physical paper using color-coded dot grids"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer",
    "rich",
    "textual",
    "Pillow",
    "numpy",
    "reedsolo",
    "zstandard",
    "opencv-python-headless",
    "qrcode>=8.2",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.6",
]

[project.optional-dependencies]
hardware = [
    "pycups",
    "python-sane",
]

[project.scripts]
paper-clip = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
